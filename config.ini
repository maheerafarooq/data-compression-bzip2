# BZip2 course project – configuration (see course documentation, §2.2)
# Stage 1 uses: block_size, rle1_enabled, bwt_type, paths; other keys are for later stages.

[ General ]
block_size = 900000
rle1_enabled = true
# bwt_type: matrix (course Stage-1, O(n^2 log n) — slow on big blocks)
#           suffix_array (extra §8.2, O(n log^2 n) — fast, used for benchmarks)
bwt_type = suffix_array
mtf_enabled = true
rle2_enabled = true
huffman_enabled = true

[ Performance ]
benchmark_mode = false
output_metrics = true

[ Paths ]
input_directory = ./benchmarks/
output_directory = ./results/
